# База — конфиг Camsara, опорный в экосистеме. Отличия только там, где
# пакет-библиотека отличается от приложения.

included:
  - Sources
  - Tests

opt_in_rules:
  - empty_count
  - empty_string
  - closure_end_indentation
  - first_where
  - sorted_imports
  - number_separator
  - yoda_condition
  - discouraged_object_literal
  - unused_closure_parameter
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - redundant_type_annotation
  - redundant_string_enum_value
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - fatal_error_message
  - unused_optional_binding
  - unavailable_function
  - strict_fileprivate
  - operator_usage_whitespace
  - multiline_arguments
  - toggle_bool

disabled_rules:
  - identifier_name
  - function_parameter_count
  - todo
  - comment_spacing

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 12
  error: 20

vertical_whitespace:
  max_empty_lines: 2

force_unwrapping:
  severity: warning

force_try:
  severity: warning

force_cast:
  severity: warning

implicitly_unwrapped_optional:
  severity: warning

unowned_variable_capture:
  severity: warning

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

large_tuple:
  warning: 3
  error: 5

reporter: "xcode"
