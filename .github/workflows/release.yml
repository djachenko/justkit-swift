name: Release

# Свой workflow, а не вызов repokit: swift-варианта там пока нет.
# Когда появится — заменить на uses: djachenko/repokit/.github/workflows/swift-release.yml

on:
  push:
    branches:
      - master

jobs:
  # Работаем прямо в master, PR-гейта нет — значит тесты гоняем перед бампом,
  # иначе тег уедет на сломанный коммит.
  verify:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Lint
        run: |
          which swiftlint || brew install swiftlint
          swiftlint --strict

      - name: Test
        run: swift test

  release:
    needs: verify
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          git-user: repokit
          git-user-email: repokit@djachenko
          command: bump
          args: --auto --disable-bump-commit

      - name: Resolve version
        id: version
        run: |
          VERSION=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$(echo "$VERSION" | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "major=$(echo "$VERSION" | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Скользящие теги, чтобы подключаться можно было и по minor/major.
          git tag -f "${{ steps.version.outputs.minor }}"
          git tag -f "${{ steps.version.outputs.major }}"
          git push origin "refs/tags/${{ steps.version.outputs.version }}"
          git push origin "refs/tags/${{ steps.version.outputs.minor }}" --force
          git push origin "refs/tags/${{ steps.version.outputs.major }}" --force
          cog changelog "${{ steps.version.outputs.version }}" > /tmp/changelog.md
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/changelog.md
